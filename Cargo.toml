[package]
name = "rexroster"
version = "0.1.0"
edition = "2024"
description = "Terminal UI that lists a Rex lead's detached worker sessions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryanlewis/rexroster"
readme = "README.md"
publish = false

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
libc = "=0.2.191"
ratatui = "=0.30.2"
serde_json = "=1.0.154"
toml_edit = "=0.25.17"
unicode-width = "=0.2.3"

[lints.clippy]
# A list longer than a u16 must not wrap a screen coordinate.
cast_possible_truncation = "warn"
